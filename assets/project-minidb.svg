  <text x="28" y="164" fill="#c9d1d9" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">INSERT 2,751 → 591,429 ops/s</text>
  <text x="28" y="197" fill="#d2a8ff" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">224 / 224 tests</text>
