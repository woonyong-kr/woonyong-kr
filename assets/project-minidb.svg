<svg xmlns="http://www.w3.org/2000/svg" width="410" height="205" viewBox="0 0 410 205" role="img" aria-labelledby="title desc">
  <title id="title">MiniDB</title>
  <desc id="desc">SQL parser부터 B+Tree, buffer pool과 디스크 페이지까지 연결한 C11 저장 엔진.</desc>
  <rect x="1" y="1" width="408" height="203" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="203" rx="3" fill="#3fb950"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="26" y="30" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="1.1">DATABASE · STORAGE · C11</text>
    <text x="26" y="62" fill="#f0f6fc" font-size="24" font-weight="700">MiniDB</text>
    <text x="26" y="89" fill="#c9d1d9" font-size="13">SQL parser → planner → B+Tree → disk page</text>
    <text x="26" y="111" fill="#8b949e" font-size="12">동일 조건의 PostgreSQL 기준선과 직접 비교한다</text>
    <line x1="26" y1="128" x2="384" y2="128" stroke="#30363d"/>
    <text x="26" y="157" fill="#f0f6fc" font-size="20" font-weight="700">73.9 → 3,218</text>
    <text x="26" y="171" fill="#8b949e" font-size="10">ops/s · 100만 행 범위 조회</text>
    <text x="276" y="157" fill="#3fb950" font-size="15" font-weight="700">224 / 224</text>
    <rect x="26" y="179" width="38" height="17" rx="8.5" fill="#238636"/><text x="39" y="191" fill="#fff" font-size="10">C</text>
    <rect x="70" y="179" width="58" height="17" rx="8.5" fill="#21262d"/><text x="81" y="191" fill="#c9d1d9" font-size="10">B+Tree</text>
    <rect x="134" y="179" width="75" height="17" rx="8.5" fill="#21262d"/><text x="145" y="191" fill="#c9d1d9" font-size="10">Buffer Pool</text>
    <text x="348" y="191" fill="#58a6ff" font-size="12" font-weight="700">OPEN →</text>
  </g>
</svg>
