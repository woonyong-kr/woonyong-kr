<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220" role="img" aria-labelledby="title desc">
  <title id="title">MiniDB</title><desc id="desc">C로 구현한 디스크 기반 SQL 엔진</desc>
  <rect x="1" y="1" width="378" height="218" rx="20" fill="#12101c" stroke="#3b2e57" stroke-width="2"/>
  <circle cx="46" cy="45" r="22" fill="#6e40c9"/><text x="46" y="52" text-anchor="middle" fill="white" font-size="18" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">DB</text>
  <text x="82" y="43" fill="#d2a8ff" font-size="22" font-weight="760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">MiniDB</text>
  <text x="82" y="65" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">C · B+Tree · Buffer Pool</text>
  <text x="28" y="105" fill="#f0f6fc" font-size="15" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">SQL부터 디스크 페이지까지 직접 연결</text>
