<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">최우녕 — Production AI, Backend, Runtime</title>
  <desc id="desc">운영 증거를 결정론적 판단과 제한된 변경으로 연결하는 백엔드 개발자</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="40" r="150" fill="#1f6feb" opacity=".09" filter="url(#glow)"/>
  <rect x="48" y="44" width="50" height="8" rx="4" fill="url(#accent)"/>
  <text x="48" y="100" fill="#f0f6fc" font-size="42" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">최우녕</text>
  <text x="48" y="134" fill="#8b949e" font-size="17" font-weight="600" letter-spacing="2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">PRODUCTION AI · BACKEND · RUNTIME</text>
  <text x="48" y="184" fill="#c9d1d9" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">증거와 실패 조건을 보존하고, 검증된 판단만 변경으로 연결</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="650">
    <rect x="48" y="222" width="108" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="102" y="244" text-anchor="middle" fill="#79c0ff">Kubernetes</text>
    <rect x="166" y="222" width="78" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="205" y="244" text-anchor="middle" fill="#d2a8ff">Python</text>
    <rect x="254" y="222" width="108" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="308" y="244" text-anchor="middle" fill="#7ee787">PostgreSQL</text>
    <rect x="372" y="222" width="78" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="411" y="244" text-anchor="middle" fill="#ffa657">C/C++</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <path d="M638 150H708M830 150H900" stroke="#484f58" stroke-width="2"/>
    <path d="M696 143L708 150L696 157M888 143L900 150L888 157" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <g transform="translate(520 91)">
      <rect width="118" height="118" rx="22" fill="#101c2c" stroke="#1f6feb"/>
      <circle cx="59" cy="35" r="12" fill="#58a6ff" opacity=".9"/>
      <text x="59" y="73" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">운영 증거</text>
      <text x="59" y="96" text-anchor="middle" fill="#8b949e" font-size="12">Evidence</text>
    </g>
    <g transform="translate(708 91)">
      <rect width="122" height="118" rx="22" fill="#171a2c" stroke="#8957e5"/>
      <path d="M48 28h26v24H48zM54 34h14M54 41h14M54 48h9" fill="none" stroke="#d2a8ff" stroke-width="2"/>
      <text x="61" y="73" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">규칙 판단</text>
      <text x="61" y="96" text-anchor="middle" fill="#8b949e" font-size="12">Decision</text>
    </g>
    <g transform="translate(900 91)">
      <rect width="134" height="118" rx="22" fill="#10251d" stroke="#238636"/>
      <path d="M52 31h30M67 22v30" stroke="#7ee787" stroke-width="3" stroke-linecap="round"/>
      <text x="67" y="73" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">제한된 변경</text>
      <text x="67" y="96" text-anchor="middle" fill="#8b949e" font-size="12">Draft PR</text>
    </g>
  </g>
</svg>
