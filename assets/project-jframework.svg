<svg xmlns="http://www.w3.org/2000/svg" width="410" height="205" viewBox="0 0 410 205" role="img" aria-labelledby="title desc">
  <title id="title">JFramework</title>
  <desc id="desc">C++ 엔진의 변경을 C# 공용 계층에서 흡수해 콘텐츠 코드와 분리한다.</desc>
  <rect x="1" y="1" width="408" height="203" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="203" rx="3" fill="#a371f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif">
    <text x="26" y="30" fill="#a371f7" font-size="11" font-weight="700" letter-spacing="1.1">RUNTIME · INTEROP · CONTRACT</text>
    <text x="26" y="62" fill="#f0f6fc" font-size="24" font-weight="700">JFramework</text>
    <text x="26" y="89" fill="#c9d1d9" font-size="13">C++ engine ↔ C# framework ↔ content teams</text>
    <text x="26" y="111" fill="#8b949e" font-size="12">엔진 변경을 공용 계층에서 흡수해 경계를 유지한다</text>
    <line x1="26" y1="128" x2="384" y2="128" stroke="#30363d"/>
    <text x="26" y="158" fill="#f0f6fc" font-size="21" font-weight="700">655</text>
    <text x="72" y="158" fill="#8b949e" font-size="11">engine APIs</text>
    <text x="242" y="158" fill="#f0f6fc" font-size="16" font-weight="700">10</text>
    <text x="269" y="158" fill="#8b949e" font-size="11">협력사 콘텐츠</text>
    <rect x="26" y="174" width="43" height="19" rx="9.5" fill="#512bd4"/><text x="37" y="188" fill="#fff" font-size="10">C#</text>
    <rect x="75" y="174" width="51" height="19" rx="9.5" fill="#00599c"/><text x="86" y="188" fill="#fff" font-size="10">C++</text>
    <rect x="132" y="174" width="78" height="19" rx="9.5" fill="#21262d"/><text x="144" y="188" fill="#c9d1d9" font-size="10">P/Invoke</text>
    <text x="348" y="188" fill="#58a6ff" font-size="12" font-weight="700">OPEN →</text>
  </g>
</svg>
