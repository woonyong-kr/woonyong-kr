name: Refresh public activity

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Accumulate public activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_profile.py \
            --login woonyong-kr \
            --history .github/activity-history.json \
            --readme README.md

      - name: Verify generated index
        run: |
          python3 -m py_compile scripts/update_profile.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          readme = Path("README.md").read_text(encoding="utf-8")
          history = json.loads(Path(".github/activity-history.json").read_text())
          markers = (
              "<!-- profile_intro:start -->",
              "<!-- profile_intro:end -->",
              "<!-- activity_summary:start -->",
              "<!-- activity_summary:end -->",
              "<!-- project_cards:start -->",
              "<!-- project_cards:end -->",
              "<!-- recent_posts:start -->",
              "<!-- recent_posts:end -->",
              "<!-- ci_status:start -->",
              "<!-- ci_status:end -->",
              "<!-- collaboration:start -->",
              "<!-- collaboration:end -->",
              "<!-- recent_work:start -->",
              "<!-- recent_work:end -->",
              "<!-- technologies:start -->",
              "<!-- technologies:end -->",
          )
          if any(readme.count(marker) != 1 for marker in markers):
              raise SystemExit("profile marker verification failed")
          if not history["commits"]:
              raise SystemExit("commit history is empty")
          if readme.count("assets/generated/repo-") != 6:
              raise SystemExit("repository card count is not six")
          if readme.count("https://woonyong-kr.github.io/#/posts/") != 6:
              raise SystemExit("recent blog post count is not six")
          assets = sorted(Path("assets/generated").glob("repo-*.svg"))
          if len(assets) != 6:
              raise SystemExit("generated repository card count is not six")
          referenced = set(re.findall(r'assets/generated/(repo-[^" ]+\.svg)', readme))
          if referenced != {asset.name for asset in assets}:
              raise SystemExit("README and generated repository cards differ")
          for asset in assets:
              ET.parse(asset)
          if "<details>" in readme or "assets/project-" in readme:
              raise SystemExit("manual or folded presentation detected")
          PY

      - name: Commit refreshed activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/activity-history.json assets/generated
          if git diff --cached --quiet; then
            echo "No public activity changes"
            exit 0
          fi
          git commit -m "chore: 공개 활동 원장 / 저장소 상태 / 협업 PR"
          git push
