name: Refresh public activity

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Accumulate public activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_profile.py \
            --login woonyong-kr \
            --projects .github/profile-projects.json \
            --history .github/activity-history.json \
            --readme README.md

      - name: Verify generated index
        run: |
          python3 -m py_compile scripts/update_profile.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          history = json.loads(Path(".github/activity-history.json").read_text())
          markers = (
              "<!-- repository_health:start -->",
              "<!-- repository_health:end -->",
              "<!-- collaboration:start -->",
              "<!-- collaboration:end -->",
              "<!-- recent_work:start -->",
              "<!-- recent_work:end -->",
          )
          if any(readme.count(marker) != 1 for marker in markers):
              raise SystemExit("profile marker verification failed")
          if not history["commits"]:
              raise SystemExit("commit history is empty")
          PY

      - name: Commit refreshed activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/activity-history.json
          if git diff --cached --quiet; then
            echo "No public activity changes"
            exit 0
          fi
          git commit -m "chore: 공개 활동 원장 / 저장소 상태 / 협업 PR"
          git push
